<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Epic Refund</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Georgia', 'Times New Roman', serif;
      color: #c8a96e;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }

    /* Контейнер на весь экран. Canvas внутри растягивается letterbox-ом. */
    #game-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #game-canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #0a0a0a;
      display: block;
      box-shadow: 0 0 80px rgba(200, 169, 110, 0.06);
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.6s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-screen h1 {
      font-size: 2.5rem;
      letter-spacing: 0.3em;
      font-weight: normal;
      color: #c8a96e;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
    }

    #loading-tip {
      font-size: 0.85rem;
      color: #7a6a4a;
      font-style: italic;
      text-align: center;
      max-width: 90%;
      margin-bottom: 2.5rem;
      letter-spacing: 0.05em;
    }

    #progress-bar-wrap {
      width: 280px;
      height: 2px;
      background: #1a1a1a;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #c8a96e 0%, #e8c98e 100%);
      transition: width 0.3s ease;
    }

    /* Подсказка по управлению, первая секунда */
    #controls-hint {
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: #555;
      letter-spacing: 0.08em;
      opacity: 0.6;
      pointer-events: none;
      font-family: 'Consolas', 'Monaco', monospace;
    }

    /* Сенсорное управление: поверх мира, но вне обычных кликов */
    #mobile-controls { position: fixed; inset: 0; z-index: 110; display: none; pointer-events: none; }
    #mobile-controls.visible { display: block; }
    #mobile-controls > * { pointer-events: auto; }
    #move-pad {
      position: absolute; left: max(20px, env(safe-area-inset-left));
      bottom: max(18px, env(safe-area-inset-bottom)); width: 132px; height: 132px;
      border: 2px solid rgba(232,201,142,.55); border-radius: 50%;
      background: rgba(17,17,20,.57); touch-action: none; user-select: none;
      box-shadow: inset 0 0 22px rgba(200,169,110,.09), 0 4px 24px #0006;
    }
    #move-pad::after { content: '+'; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); opacity: .2; font: 32px monospace; }
    #move-knob {
      position: absolute; width: 54px; height: 54px; left: 37px; top: 37px; z-index: 1;
      border-radius: 50%; border: 2px solid #e8c98e; background: rgba(200,169,110,.32);
      box-shadow: 0 0 12px #c8a96e44; pointer-events: none;
    }
    .touch-button {
      display: flex; justify-content: center; align-items: center;
      background: rgba(17,16,21,.8); color: #f5e0b2; border: 1.5px solid rgba(232,201,142,.65);
      border-radius: 17px; font: 700 20px system-ui,sans-serif; min-width: 46px; min-height: 46px;
      padding: 0; touch-action: none; user-select: none;
      -webkit-tap-highlight-color: transparent; box-shadow: 0 4px 16px #0008;
    }
    .touch-button.held, .touch-button:active { background: #b7894a; color: #15100b; transform: scale(.95); }
    .touch-button:focus-visible, #settings-open:focus-visible, #settings-panel button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    #mobile-actions {
      position: absolute; right: max(20px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      display: grid; grid-template-columns: repeat(2, 64px); gap: 8px;
    }
    #mobile-actions .touch-button { width: 64px; height: 62px; border-radius: 20px; font-size: 24px; }
    #mobile-actions [data-action="attackLight"] { background: rgba(109,44,27,.85); }
    #mobile-actions [data-action="interact"] { border-color: #d6b75d; }
    /* Контекстный ввод: во время диалога/жертвы освободить нижние углы.
       E остаётся для продолжения реплики, выборы и навигация Врат отдельно. */
    #mobile-controls.dialogue-active #move-pad,
    #mobile-controls.dialogue-active #mobile-skills,
    #mobile-controls.dialogue-active #mobile-actions [data-action="attackLight"],
    #mobile-controls.dialogue-active #mobile-actions [data-action="attackHeavy"],
    #mobile-controls.dialogue-active #mobile-actions [data-action="roll"],
    #mobile-controls.gate-active #move-pad,
    #mobile-controls.gate-active #mobile-skills,
    #mobile-controls.gate-active #mobile-actions { display: none; }
    #mobile-skills .touch-button.cooling { border-color: #d38e41; color: #ffdba4; background: rgba(95,49,22,.86); }
    #mobile-skills .touch-button.unavailable { border-color: #59545b; color: #958e91; background: rgba(21,18,23,.78); opacity: .72; }
    #mobile-skills .touch-button.ability-active { background: #20573c; border-color: #75f0a7; color: white; }
    #mobile-skills {
      position: absolute; right: max(15px, env(safe-area-inset-right));
      top: calc(env(safe-area-inset-top) + 66px); display: flex; gap: 6px;
    }
    .touch-active #controls-hint { display: none; }
    #mobile-choices {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom) + 18px); display: none; gap: 6px;
    }
    #mobile-choices.choices-visible { display: flex; }
    #mobile-gate-nav {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom) + 18px);
      display: none; gap: 8px;
    }
    #mobile-gate-nav.gate-nav-visible { display: flex; }
    #mobile-gate-nav .touch-button {
      min-width: 48px; min-height: 48px; font-size: 22px; border-radius: 13px;
    }
    #mobile-choices .touch-button { width: 43px; height: 43px; font-size: 16px; border-radius: 12px; }
    #settings-open {
      position: fixed; z-index: 160; top: calc(env(safe-area-inset-top) + 12px);
      right: max(16px, env(safe-area-inset-right)); width: 48px; height: 48px;
      color: #f0d39a; background: rgba(18,15,19,.9); border: 1px solid #a28558;
      border-radius: 15px; font-size: 25px; cursor: pointer;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    #settings-panel:not([hidden]) {
      display: flex; position: fixed; inset: 0; z-index: 200;
      align-items: center; justify-content: center; padding: 18px;
      background: rgba(0,0,0,.85); backdrop-filter: blur(8px);
      touch-action: manipulation; overflow: auto;
    }
    #settings-panel[hidden] { display: none; }
    .settings-card {
      width: min(100%, 440px); max-height: min(94vh, 640px); overflow: auto;
      color: #efdfc1; border: 1px solid #8a6a42; border-radius: 20px;
      background: linear-gradient(160deg,#201b1c,#0f1015); padding: 24px;
      box-shadow: 0 22px 80px #000c; font-family: system-ui,sans-serif;
    }
    .settings-card header { display: flex; justify-content: space-between; align-items: center; gap: 18px; }
    .settings-card h2 { font: 700 19px system-ui,sans-serif; letter-spacing: .13em; }
    #settings-close { width: 44px; height: 44px; color: #f3d6a3; background: #2c2529; border: 1px solid #7d6848; border-radius: 12px; font-size: 20px; }
    .settings-description { margin: 12px 0 22px; font-size: 14px; color: #baa78f; }
    .settings-primary { display: block; width: 100%; min-height: 52px; background: #c8a96e; color: #211814; border: 0; border-radius: 12px; font: 700 16px system-ui,sans-serif; cursor: pointer; }
    .settings-touch { display: flex; align-items: center; gap: 13px; margin-top: 22px; min-height: 44px; font-size: 15px; }
    .settings-touch input { width: 23px; height: 23px; accent-color: #c8a96e; }
    #settings-status { margin-top: 14px; font-size: 13px; color: #e7a6a6; line-height: 1.5; min-height: 1em; }
    .settings-hint { margin-top: 12px; color: #8f857a; font-size: 12px; line-height: 1.5; }
    #orientation-hint { display: none; z-index: 112; position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 14px);
      font: 12px system-ui,sans-serif; color: #dbc69b; background: rgba(14,12,14,.8); border-radius: 11px; padding: 10px; pointer-events:none; }
    @media (orientation: portrait) and (max-width: 850px) {
      #orientation-hint { display: block; top: calc(env(safe-area-inset-top) + 138px); width: min(72%, 300px); text-align: center; }
      #mobile-choices { bottom: calc(env(safe-area-inset-bottom) + 164px); }
      #mobile-gate-nav { bottom: calc(env(safe-area-inset-bottom) + 174px); }
    }
    @media (max-height: 420px) {
      #move-pad { width: 106px; height: 106px; }
      #move-knob { width: 48px; height: 48px; left: 27px; top: 27px; }
      #mobile-actions { grid-template-columns: repeat(2, 52px); gap: 6px; }
      #mobile-actions .touch-button { width: 52px; height: 48px; font-size: 20px; }
      #mobile-skills { top: calc(env(safe-area-inset-top) + 6px); right: calc(env(safe-area-inset-right) + 75px); }
      #mobile-skills .touch-button { min-height: 38px; min-width: 38px; }
      #mobile-choices { bottom: 10px; }
      #mobile-gate-nav { bottom: 10px; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="960" height="540"></canvas>
  </div>

  <div id="loading-screen">
    <h1>Epic Refund</h1>
    <p id="loading-tip">«Что если RPG начинается с финального босса?»</p>
    <div id="progress-bar-wrap">
      <div id="progress-bar"></div>
    </div>
  </div>

  <div id="orientation-hint">Для удобства поверните телефон горизонтально ↻</div>
  <div id="controls-hint">WASD / джойстик — движение · J — атака · K — парирование · E — действие · Shift — перекат · ⚙ — настройки</div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
